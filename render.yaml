services:
  # Frontend Static Site
  - type: web
    name: stealthpay-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://stealthpay-backend.onrender.com # Replace with your actual backend URL after first deployment

  # Backend Web Service
  - type: web
    name: stealthpay-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard or link to a Render DB
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
